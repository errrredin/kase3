<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просто слайдер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
    <div class="header">
        <h2>Мой слайдер</h2>
    </div>

    <div class="slider-box">
        <div class="slider-holder" id="sliderHolder">
            <div class="slider-line" id="sliderLine">
                <!-- Тут картинки -->
            </div>
        </div>

        <div class="nav-buttons">
            <button class="btn-left" id="btnLeft">←</button>
            <button class="btn-right" id="btnRight">→</button>
        </div>

        <div class="dots" id="dotsBox">
            <!-- Точки -->
        </div>

        <div class="info-panel">
            <span id="currentNum">1</span> / <span id="totalNum">0</span>
        </div>
    </div>

    <div class="bottom-info">
        <p class="img-title" id="imgTitle">Название</p>
        <p class="img-desc" id="imgDesc">Описание</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
